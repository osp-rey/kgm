<section class="sect-p s-test" id="s-test">
  <div class="container">
    <picture class="s-test__bg">
      <img src="@img/test.jpg" alt="image" />
    </picture>
    <div class="s-test__body">
      <div class="s-title s-test__title">Запишитесь на тест-драйв</div>
      <div class="content-box s-test__content">
        <p>
          Запишитесь на пробную поездку и <br> получите индивидуальное предложение
        </p>
      </div>
      <div class="s-test__form-wrap">
        <form action="#" class="s-test__form">
          <div class="form-grid">
            <div class="form-control _full">
              <div class="form-control-name">Телефон</div>
              <input
                type="tel"
                placeholder="+7 (___) ___-__-__"
                class="input"
              />
            </div>
            <div class="form-control">
              <div class="form-control-name">Выберите модель</div>
              <div class="select">
                <div class="select-btn">
                  <input
                    type="text"
                    placeholder="KORANDO"
                    readonly
                    class="input select-input"
                  />
                  <i class="icon-bottom select-arrow"></i>
                </div>
                <div class="select-body">
                  <div class="select-item">KORANDO 1</div>
                  <div class="select-item">KORANDO 2</div>
                  <div class="select-item">KORANDO 3</div>
                  <div class="select-item">KORANDO 4</div>
                </div>
              </div>
            </div>
            <div class="form-control">
              <div class="form-control-name">Выберите удобную дату</div>
              <input type="text" placeholder="Желаемая дата" class="input" />
            </div>
            <div class="form-control _full">
              <div class="check-wrap">
                <span class="wpcf7-form-control-wrap" data-name="acceptance-60">
                  <span class="wpcf7-form-control wpcf7-acceptance">
                    <span class="wpcf7-list-item">
                      <label>
                        <input
                          type="checkbox"
                          name="acceptance-60"
                          value="1"
                          aria-invalid="false"
                        />
                        <span class="wpcf7-list-item-label">
                          <span>
                            Я соглашаюсь с 
                            <a href="/personal-data" target="_blank">
                              Правилами обработки персональных данных
                            </a>
                          </span>
                        </span>
                      </label>
                    </span>
                  </span>
                </span>
              </div>
            </div>
            <div class="form-control _full">
              <div class="check-wrap">
                <span class="wpcf7-form-control-wrap" data-name="acceptance-60">
                  <span class="wpcf7-form-control wpcf7-acceptance">
                    <span class="wpcf7-list-item">
                      <label>
                        <input
                          type="checkbox"
                          name="acceptance-60"
                          value="1"
                          aria-invalid="false"
                        />
                        <span class="wpcf7-list-item-label">
                          <span>
                            Я соглашаюсь на получение
                            <a href="/advertising-mail" target="_blank">
                              информационно-рекламной рассылки
                            </a>
                          </span>
                        </span>
                      </label>
                    </span>
                  </span>
                </span>
              </div>
            </div>
            <button type="submit" class="btn-s"><span>Записаться на тест-драйв</span></button>
          </div>
        </form>
      </div>
    </div>
  </div>
</section>
